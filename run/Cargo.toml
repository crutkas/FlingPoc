[workspace]
members = [
    "crates/fling-airplay",
    "crates/fling-airplay-sidecar",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json", "tokio"] }
constant_time_eq = "=0.5.0"
mdns-sd = { version = "=0.21.0", default-features = false, features = ["async"] }
plist = "=1.10.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

